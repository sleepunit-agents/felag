when:
  - event: push
    branch: main
  - event: pull_request

steps:
  - name: install
    image: node:22-bookworm-slim
    commands:
      - npm ci

  - name: build
    image: node:22-bookworm-slim
    commands:
      - npm run build
    depends_on: [install]

  - name: lint-spec
    image: node:22-bookworm-slim
    commands:
      - node dist/cli.js lint spec/felag-core
      - node dist/cli.js lint spec/felag-tasks
      - node dist/cli.js lint spec/felag-mcp
    depends_on: [build]

  - name: test
    image: node:22-bookworm-slim
    commands:
      - npm test
    depends_on: [build]

  - name: self-verify
    image: node:22-bookworm-slim
    commands:
      - npm run self-verify
    depends_on: [build]

  - name: self-verify-tasks
    image: node:22-bookworm-slim
    commands:
      - npx tsx scripts/self-verify-tasks.ts
    depends_on: [build]

  - name: smoke
    image: node:22-bookworm-slim
    commands:
      - npm run smoke
    depends_on: [build]

  - name: check-governance
    image: node:22-bookworm-slim
    commands:
      - npx tsx scripts/check-triplets.ts
      - npx tsx scripts/check-ack-currency.ts
    depends_on: [build]
